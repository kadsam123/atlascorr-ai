openapi: 3.1.0
info:
  title: AtlasCorr AI API
  version: 1.0.0
  description: >
    AtlasCorr AI provides HS classification, tariff lookup, compliance checks,
    route scoring, and export plan generation for SMEs. The /api/pipeline endpoint
    orchestrates multi-step workflows and may delegate specialized tasks to
    verified partner agents, returning a unified result and billing ledger.
  contact:
    name: AtlasCorr AI Support
    url: https://circletrade.ai
    email: support@circletrade.ai
  license:
    name: MIT
  x-guidance: |
    ### AtlasCorr AI Agent Guidance
    - Set the `X-API-Key: ct-demo-key-2026` header to authenticate.
    - Query `/api/hs-code` to identify the HS code and category of the product.
    - Query `/api/tariff` to lookup import duties for the corridor.
    - Query `/api/compliance` to determine sanctions and permit requirements.
    - Query `/api/route-score` to evaluate transit times and shipping scores.
    - Or run the comprehensive `/api/pipeline` for full orchestrated routing.

servers:
  - url: https://atlascorr-agent-api-production.up.railway.app
    description: Production

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    ProductDescription:
      type: object
      required: [name, description, origin_country, destination_country]
      properties:
        name:
          type: string
          example: Steel bolts
        description:
          type: string
          example: Galvanized steel bolts for industrial machinery
        origin_country:
          type: string
          example: US
        destination_country:
          type: string
          example: DE
        hs_code_hint:
          type: [string, "null"]
          example: "7318.15"

    HSClassificationResult:
      type: object
      properties:
        hs_code:
          type: string
          example: "7318.15"
        confidence:
          type: number
          format: float
          example: 0.94
        reasoning:
          type: string
          example: Matches fasteners / steel bolts classification.

    TariffBreakdown:
      type: object
      properties:
        hs_code:
          type: string
          example: "7318.15"
        origin_country:
          type: string
          example: US
        destination_country:
          type: string
          example: DE
        duty_rate_pct:
          type: number
          format: float
          example: 4.7
        additional_duties:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Custom processing fee
              rate_pct:
                type: number
                format: float
                example: 0.2
        notes:
          type: string
          example: Standard industrial fasteners duty.
        enrichment:
          type: object
          properties:
            applied:
              type: boolean
            taric_rate:
              type: [number, "null"]
            taric_last_updated:
              type: string
            source_ref:
              type: string
        qa_supervisor:
          type: object
          properties:
            status:
              type: string
            self_reflection_log:
              type: array
              items:
                type: string

    ComplianceCheckResult:
      type: object
      properties:
        compliant:
          type: boolean
          example: true
        passed:
          type: boolean
          example: true
        hs_code:
          type: string
          example: "2009.12"
        origin_country:
          type: string
          example: CA
        destination_country:
          type: string
          example: DE
        category:
          type: string
          example: food
        required_documents:
          type: array
          items:
            type: string
          example: ["Commercial Invoice", "Certificate of Origin"]
        licensing_flags:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: FOOD_SAFETY
              required:
                type: boolean
                example: true
        sanctions_flags:
          type: array
          items:
            type: string
          example: []
        notes:
          type: string
          example: Deterministic DDTRS baseline for food.
        enrichment:
          type: object
          properties:
            applied:
              type: boolean
            regulatory_updates:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  effective_date:
                    type: string
                  summary:
                    type: string
                  source_ref:
                    type: string
            risk_score:
              type: [number, "null"]
            risk_notes:
              type: array
              items:
                type: string
        qa_supervisor:
          type: object
          properties:
            status:
              type: string
            self_reflection_log:
              type: array
              items:
                type: string

    RouteScoreResult:
      type: object
      properties:
        origin_country:
          type: string
          example: CA
        destination_country:
          type: string
          example: DE
        mode:
          type: string
          example: sea
        port_origin:
          type: string
          example: Montreal
        port_destination:
          type: string
          example: Hamburg
        base_transit_time_days:
          type: integer
          example: 14
        base_cost_estimate_usd:
          type: number
          example: 3200
        route_score:
          type: number
          format: float
          example: 0.78
        notes:
          type: string
          example: Deterministic baseline route score for CA→DE sea freight.
        enrichment:
          type: object
          properties:
            applied:
              type: boolean
            live_delay_risk:
              type: [number, "null"]
            port_congestion_index:
              type: [number, "null"]
            live_cost_adjustment_usd:
              type: [number, "null"]
            logistics_updates:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  summary:
                    type: string
                  source_ref:
                    type: string
        qa_supervisor:
          type: object
          properties:
            status:
              type: string
            self_reflection_log:
              type: array
              items:
                type: string

    ExportPlan:
      type: object
      properties:
        hs_code:
          type: string
          example: "2009.12"
        origin_country:
          type: string
          example: CA
        destination_country:
          type: string
          example: DE
        mode:
          type: string
          example: sea
        category:
          type: string
          example: food
        core_steps:
          type: array
          items:
            type: object
            properties:
              order:
                type: integer
              title:
                type: string
              mandatory:
                type: boolean
        core_documents:
          type: array
          items:
            type: string
        timeline_estimate_days:
          type: integer
          example: 21
        notes:
          type: string
          example: Deterministic baseline export plan for food cargo CA→DE.
        enrichment:
          type: object
          properties:
            applied:
              type: boolean
            country_specific_tips:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  summary:
                    type: string
                  source_ref:
                    type: string
            llm_guidance:
              type: array
              items:
                type: string
            example_checklist:
              type: array
              items:
                type: string
        qa_supervisor:
          type: object
          properties:
            status:
              type: string
            self_reflection_log:
              type: array
              items:
                type: string

    OrchestrationLedger:
      type: object
      properties:
        status:
          type: string
          example: "DELEGATED_MARKETPLACE"
        explanation:
          type: string
        billing_transparency:
          type: object
          properties:
            core_orchestrator_cost_usd:
              type: number
              format: float
              example: 5.00
            external_agents_cost_usd:
              type: number
              format: float
              example: 0.25
            total_aggregate_cost_usd:
              type: number
              format: float
              example: 5.25
            payment_method:
              type: string
              example: "Stripe Metered Usage Ledger"

    PipelineResponse:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        customer:
          type: string
          example: Acme Trade Group
        dispatched_gaps:
          type: array
          items:
            type: object
            properties:
              service_name:
                type: string
                example: DocParserAgent
              gap_type:
                type: string
                example: document_extraction
              cost_usd:
                type: number
                format: float
                example: 0.25
              partner_endpoint:
                type: string
                example: https://stableenrich.dev/apis/v1/doc-extractor
              description:
                type: string
                example: Parses shipping documents.
              status:
                type: string
                example: success
              result:
                type: object
        orchestration_ledger:
          $ref: '#/components/schemas/OrchestrationLedger'

    # ── Circle Payment Agent Schemas ─────────────────────────────────────────
    AgentWallet:
      type: object
      required: [address, wallet_id, balance_usdc, chain, provider]
      properties:
        address:
          type: string
          description: On-chain public address of the agent wallet.
          example: "0xa98f487e4521bcbfbec7e5f55698addee5239700b5"
        wallet_id:
          type: string
          description: Circle-assigned wallet identifier.
          example: "wallet-agent-3f8a7b2c"
        balance_usdc:
          type: number
          format: double
          description: Current USDC balance held by the agent wallet.
          example: 99.94
        chain:
          type: string
          enum: [BASE_SEPOLIA, BASE_MAINNET]
          description: Blockchain network the wallet operates on.
          example: BASE_SEPOLIA
        provider:
          type: string
          enum: [Circle-Developer-Controlled, Circle-Agent-Wallet]
          description: Circle wallet provisioning type.
          example: Circle-Developer-Controlled
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of wallet creation.

    PaymentRequest:
      type: object
      required: [sender_address]
      properties:
        sender_address:
          type: string
          description: Public address of the sending agent wallet.
          example: "0xa98f487e4521bcbfbec7e5f55698addee5239700b5"
        amount:
          type: number
          format: double
          description: Amount of USDC to transfer. Defaults to 0.01 if omitted.
          default: 0.01
          example: 0.01

    PaymentTransaction:
      type: object
      required: [tx_hash, sender, recipient, amount_usdc, chain, explorer_url]
      properties:
        tx_hash:
          type: string
          description: On-chain transaction hash.
          example: "0x4d0943db27ee28dc0df0f22e136b5d6759eea9e7fb2c2429e6fbc4e24ac74f89"
        sender:
          type: string
          description: Sender agent wallet address.
          example: "0xa98f487e4521bcbfbec7e5f55698addee5239700b5"
        recipient:
          type: string
          description: Treasury or service wallet address that received USDC.
          example: "0xfb29a5bcbfbec7e5f55698addee52397003eb1d9"
        amount_usdc:
          type: number
          format: double
          description: Amount transferred in USDC.
          example: 0.01
        chain:
          type: string
          enum: [BASE_SEPOLIA, BASE_MAINNET]
          example: BASE_SEPOLIA
        explorer_url:
          type: string
          format: uri
          description: Clickable block explorer URL for the transaction.
          example: "https://sepolia.basescan.org/tx/0x4d0943db27ee28dc..."

    PaymentProof:
      type: object
      required: [success, confirmed, confirmations, block_number, transaction]
      properties:
        success:
          type: boolean
          description: Whether the proof query succeeded.
          example: true
        confirmed:
          type: boolean
          description: Whether the transaction has been confirmed on-chain.
          example: true
        confirmations:
          type: integer
          description: Number of block confirmations.
          example: 6
        block_number:
          type: integer
          description: Block number where the transaction was included.
          example: 14785921
        transaction:
          $ref: '#/components/schemas/PaymentTransaction'
        timestamp:
          type: string
          format: date-time

    OperatingMode:
      type: object
      description: Indicates whether the payment agent is running in live on-chain mode or sandbox simulation.
      properties:
        mode:
          type: string
          enum: [LIVE_ONCHAIN, SIMULATION]
          description: Active operating mode. SIMULATION uses in-memory wallets; LIVE_ONCHAIN uses Circle Programmable Wallets SDK.
          example: SIMULATION
        live_mode_status:
          type: string
          enum: [STABLE, DEGRADED, OFFLINE]
          example: STABLE
        simulation_mode_status:
          type: string
          enum: [STABLE, DEGRADED, OFFLINE]
          example: STABLE

    PaymentError:
      type: object
      required: [error, message, timestamp]
      properties:
        error:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, INSUFFICIENT_FUNDS, INVALID_TRANSACTION]
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error description.
        timestamp:
          type: string
          format: date-time

paths:
  /api/hs-code:
    post:
      summary: HS code classification
      description: Classify a product into an HS code based on description and trade corridor.
      tags: [Classification]
      x-price: "0.10"
      x-meter-id: "meter_hs_code_agent"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDescription'
      responses:
        '200':
          description: HS classification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HSClassificationResult'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/tariff:
    post:
      summary: Tariff lookup
      description: Calculate tariff and duty breakdown for a given HS code and corridor.
      tags: [Tariff]
      x-price: "0.20"
      x-meter-id: "meter_tariff_agent"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hs_code, origin_country, destination_country]
              properties:
                hs_code:
                  type: string
                  example: "7318.15"
                origin_country:
                  type: string
                  example: US
                destination_country:
                  type: string
                  example: DE
      responses:
        '200':
          description: Tariff breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffBreakdown'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/compliance:
    post:
      summary: Trade compliance check
      description: Run compliance checks for a shipment, including sanctions, documents, and corridor rules.
      tags: [Compliance]
      x-price: "0.75"
      x-meter-id: "meter_compliance_agent"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product, origin_country, destination_country]
              properties:
                product:
                  $ref: '#/components/schemas/ProductDescription'
                origin_country:
                  type: string
                  example: US
                destination_country:
                  type: string
                  example: DE
                value_usd:
                  type: number
                  format: float
                  example: 50000
      responses:
        '200':
          description: Compliance check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCheckResult'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/route-score:
    post:
      summary: Route scoring
      description: Score possible trade routes for a corridor based on risk, cost, and transit time.
      tags: [Routing]
      x-price: "0.50"
      x-meter-id: "meter_route_agent"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin_country, destination_country]
              properties:
                origin_country:
                  type: string
                  example: US
                destination_country:
                  type: string
                  example: DE
                mode:
                  type: string
                  example: "sea"
      responses:
        '200':
          description: Route scoring result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteScoreResult'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/export-plan:
    post:
      summary: Export plan generation
      description: Generate an export plan for a given product and corridor, including compliance notes.
      tags: [ExportPlan]
      x-price: "2.50"
      x-meter-id: "meter_export_plan"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product, origin_country, destination_country]
              properties:
                product:
                  $ref: '#/components/schemas/ProductDescription'
                origin_country:
                  type: string
                  example: US
                destination_country:
                  type: string
                  example: DE
                incoterm:
                  type: string
                  example: "FOB"
      responses:
        '200':
          description: Export plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportPlan'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/pipeline:
    post:
      summary: Orchestrated trade intelligence pipeline
      description: >
        Run a multi-step pipeline that may include HS classification, tariff lookup,
        compliance checks, route scoring, export plan generation, and marketplace
        delegation to partner agents when gaps are detected.
      tags: [Pipeline]
      x-price: "5.00"
      x-meter-id: "meter_pipeline"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: string
                  example: "Acme Trade Group"
                product:
                  $ref: '#/components/schemas/ProductDescription'
                additional_requirements:
                  type: array
                  items:
                    type: string
                  example: ["document_extraction", "financial_analysis"]
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      filename:
                        type: string
                      file_type:
                        type: string
                        example: "pdf"
      responses:
        '200':
          description: Orchestrated pipeline response with marketplace delegation and billing ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error during orchestration

  /api/dossier-batch:
    post:
      summary: Multi-corridor batch export dossiers
      description: Run comparative pipeline checks across multiple HS codes and corridors in parallel.
      tags: [Dossier]
      x-price: "10.00"
      x-meter-id: "meter_dossier_batch"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin_country, corridors, hs_codes]
              properties:
                origin_country:
                  type: string
                  example: CA
                corridors:
                  type: array
                  items:
                    type: string
                  example: ["DE", "AE", "SN"]
                hs_codes:
                  type: array
                  items:
                    type: string
                  example: ["2009.12", "6203.42"]
                mode:
                  type: string
                  example: sea
                min_cargo_value:
                  type: number
                  example: 25000
      responses:
        '200':
          description: Batch portfolio of shipment dossiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  origin_country:
                    type: string
                  mode:
                    type: string
                  portfolio_summary:
                    type: object
                    properties:
                      fully_enriched_count:
                        type: integer
                      degraded_count:
                        type: integer
                      high_risk_count:
                        type: integer
                      total_dossiers:
                        type: integer
                  dossiers:
                    type: array
                    items:
                      type: object
                  timestamp:
                    type: string
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/portfolio-analytics:
    post:
      summary: Compile portfolio strategy metrics
      description: Aggregate and rank shipment dossiers across suitability, risk, and cost indexes.
      tags: [Analytics]
      x-price: "15.00"
      x-meter-id: "meter_portfolio_analytics"
      x-billing-mode: "metered"
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin_country, corridors, hs_codes]
              properties:
                origin_country:
                  type: string
                  example: CA
                corridors:
                  type: array
                  items:
                    type: string
                  example: ["DE", "AE", "SN"]
                hs_codes:
                  type: array
                  items:
                    type: string
                  example: ["2009.12", "6203.42"]
                mode:
                  type: string
                  example: sea
                min_cargo_value:
                  type: number
                  example: 25000
      responses:
        '200':
          description: Evaluated portfolio rankings and aggregated metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id:
                    type: string
                  origin_country:
                    type: string
                  mode:
                    type: string
                  metrics:
                    type: object
                  rankings:
                    type: object
                  timestamp:
                    type: string
        '400':
          description: Invalid request
        '401':
          description: Unauthorized

  /api/portfolio-analytics/{id}:
    get:
      summary: Retrieve saved analytics run
      description: Fetch calculated strategy rankings by execution run UUID.
      tags: [Analytics]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved portfolio analytics record
        '404':
          description: Saved report not found

  # ── Circle Payment Agent Endpoints ───────────────────────────────────────────
  /api/payment/create-wallet:
    post:
      summary: Create Circle agent wallet
      description: >
        Instantiate a developer-controlled programmable wallet via the Circle Agent Stack.
        The wallet is provisioned on Base Sepolia (testnet) or Base Mainnet depending on
        the active operating mode. Each wallet receives an initial sandbox USDC allocation
        for demo purposes. In LIVE_ONCHAIN mode, the wallet must be funded externally.
      tags: [Payment]
      security:
        - ApiKeyAuth: []
      responses:
        '201':
          description: Circle programmable agent wallet created successfully.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, wallet]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Circle programmable agent wallet created successfully."
                  wallet:
                    $ref: '#/components/schemas/AgentWallet'
        '401':
          description: Unauthorized — invalid or missing API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'

  /api/payment/wallet/{address}:
    get:
      summary: Retrieve agent wallet state
      description: >
        Query the current balance, chain, and metadata of a registered agent wallet
        by its public address. Returns 404 if the address has not been provisioned.
      tags: [Payment]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: address
          in: path
          required: true
          description: On-chain public address of the agent wallet.
          schema:
            type: string
            example: "0xa98f487e4521bcbfbec7e5f55698addee5239700b5"
      responses:
        '200':
          description: Agent wallet state retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWallet'
        '404':
          description: No active agent wallet found for the specified address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'

  /api/payment/pay:
    post:
      summary: Execute autonomous USDC micropayment
      description: >
        Transfer a specified amount of USDC (default 0.01) from a registered agent
        wallet to the AtlasCorr Treasury wallet on Base Sepolia. This endpoint is
        the core of the A2A (Agent-to-Agent) payment flow: an agent pays for a
        premium enrichment service before the enrichment executes. The returned
        transaction hash can be passed to /api/dossier-batch via the payment_tx_hash
        field to unlock premium web enrichment across all sub-agents.
      tags: [Payment]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Autonomous USDC micropayment settled on-chain via Circle Agent Stack.
          content:
            application/json:
              schema:
                type: object
                required: [success, message, transaction, wallet_balance_usdc, timestamp]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Autonomous USDC micropayment settled on-chain via Circle Agent Stack."
                  transaction:
                    $ref: '#/components/schemas/PaymentTransaction'
                  wallet_balance_usdc:
                    type: number
                    format: double
                    description: Updated wallet balance after the transfer.
                    example: 99.93
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Validation error (missing sender_address) or insufficient USDC balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'
        '404':
          description: Sender agent wallet not found. Must be created first via /create-wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'

  /api/payment/proof:
    get:
      summary: Verify on-chain transaction proof
      description: >
        Confirm that a USDC transfer transaction has been included and confirmed
        on the Base Sepolia blockchain. Returns the block number, confirmation
        count, and a clickable block explorer URL. This endpoint is called
        internally by /api/dossier-batch to gate premium enrichment authorization.
      tags: [Payment]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: tx
          in: query
          required: true
          description: The 0x-prefixed 64-character hex transaction hash to verify.
          schema:
            type: string
            pattern: "^0x[a-fA-F0-9]{64}$"
            example: "0x4d0943db27ee28dc0df0f22e136b5d6759eea9e7fb2c2429e6fbc4e24ac74f89"
      responses:
        '200':
          description: Transaction proof verified with block confirmations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProof'
        '400':
          description: Invalid transaction hash format (must be 0x + 64 hex characters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'

