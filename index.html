<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AtlasCorr AI — Autonomous Export Intelligence Platform for SMEs. Powered by Meridian Flow, TradeMatch, DDTRS, and CircleBrain.">
  <title>AtlasCorr AI — Export Intelligence Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <circle cx="13" cy="13" r="12" stroke="url(#lg1)" stroke-width="1.5"/>
            <path d="M6 13 Q13 5 20 13 Q13 21 6 13Z" fill="url(#lg1)" opacity="0.7"/>
            <circle cx="13" cy="13" r="3" fill="#00d4ff"/>
            <defs>
              <linearGradient id="lg1" x1="0" y1="0" x2="26" y2="26">
                <stop offset="0%" stop-color="#00d4ff"/>
                <stop offset="100%" stop-color="#7c3aed"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-main">AtlasCorr</span>
          <span class="logo-sub">AI</span>
        </div>
      </div>

      <div class="sidebar-status">
        <div class="status-dot pulse"></div>
        <span>AUTONOMOUS · LIVE</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-view="pipeline" id="nav-pipeline">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
          <span>Pipeline</span>
        </a>
        <a href="#" class="nav-item" data-view="customers" id="nav-customers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Customers</span>
        </a>
        <a href="#" class="nav-item" data-view="opportunities" id="nav-opportunities">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
          </svg>
          <span>Opportunities</span>
        </a>
        <a href="#" class="nav-item" data-view="dossiers" id="nav-dossiers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span>Dossiers</span>
        </a>
        <a href="#" class="nav-item" data-view="compliance" id="nav-compliance">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Compliance</span>
        </a>
        <a href="#" class="nav-item" data-view="marketplace" id="nav-marketplace">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
          </svg>
          <span>Marketplace</span>
        </a>
        <a href="#" class="nav-item" data-view="notifications" id="nav-notifications">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span>Alerts</span>
          <span class="nav-badge" id="nav-badge">3</span>
        </a>
        <a href="#" class="nav-item" data-view="logs" id="nav-logs">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>
          <span>Logs</span>
        </a>
        <a href="sme.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 4px 12px; border-radius: 8px; font-size: 13px; color: var(--t2); transition: all var(--tr);">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width: 18px; height: 18px;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>SME Portal</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="next-run-card">
          <div class="next-run-label">Next Daily Run</div>
          <div class="next-run-timer" id="next-run-timer">00:00:00</div>
          <div class="next-run-bar"><div class="next-run-fill" id="next-run-fill"></div></div>
        </div>
        <div class="sidebar-powered">
          <a href="pricing.html" class="powered-link">
            <div class="powered-label">POWERED BY</div>
            <div class="powered-brand">Circle Agent Stack</div>
            <div class="powered-cta">View Plans &amp; Agents →</div>
          </a>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <h1 id="page-title">Dashboard</h1>
          <div class="breadcrumb" id="page-breadcrumb">AtlasCorr AI → Dashboard</div>
        </div>
        <div class="topbar-right">
          <div class="api-mode-selector">
            <span class="api-mode-badge live" id="api-mode-toggle-btn" style="cursor: default;" title="Production API Connection Active">
              <span class="mode-dot"></span>
              <span class="mode-text">LIVE API</span>
            </span>
            <button class="api-settings-btn" onclick="CT.app.openApiSettings()" title="Configure API Server & Key">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
          <div class="datetime-display" id="datetime-display"></div>
          <button class="run-btn" id="run-pipeline-btn" onclick="CT.app.quickRun()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Run Pipeline
          </button>
        </div>
      </header>

      <div id="content">
        <!-- Views rendered by JS -->
      </div>
    </main>
  </div>

  <!-- Detail / Pipeline Modal -->
  <div id="pipeline-modal" class="modal hidden">
    <div class="modal-backdrop" onclick="CT.app.closePipelineModal()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Details</h2>
        <button class="modal-close" onclick="CT.app.closePipelineModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-pipeline-body"></div>
    </div>
  </div>

  <!-- API Settings Modal -->
  <div id="api-settings-modal" class="modal hidden">
    <div class="modal-backdrop" onclick="CT.app.closeApiSettings()"></div>
    <div class="modal-content settings-modal">
      <div class="modal-header">
        <h2>Circle API Configuration</h2>
        <button class="modal-close" onclick="CT.app.closeApiSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label" style="display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-muted);">PRODUCTION API BASE URL</label>
          <input type="text" id="api-settings-url" class="compliance-input" style="width: 100%; font-family: var(--font-mono); font-size: 13px;" placeholder="https://api.circletrade.ai">
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" style="display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-muted);">STRIPE METERED API KEY (X-API-Key)</label>
          <input type="password" id="api-settings-key" class="compliance-input" style="width: 100%; font-family: var(--font-mono); font-size: 13px;" placeholder="ct-demo-key-2026">
        </div>
        <div class="settings-actions" style="display: flex; gap: 10px; justify-content: flex-end;">
          <button class="filter-btn" onclick="CT.app.closeApiSettings()">Cancel</button>
          <button class="run-btn" onclick="CT.app.saveApiSettings()">Save Configurations</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data/mockData.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/modules/meridianFlow.js"></script>
  <script src="js/modules/tradeMatch.js"></script>
  <script src="js/modules/ddtrs.js"></script>
  <script src="js/modules/circleBrain.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/ui/pipeline.js"></script>
  <script src="js/ui/customers.js"></script>
  <script src="js/ui/opportunities.js"></script>
  <script src="js/ui/dossier.js"></script>
  <script src="js/ui/compliance.js"></script>
  <script src="js/ui/marketplace.js"></script>
  <script src="js/ui/notifications.js"></script>
  <script src="js/ui/logs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
